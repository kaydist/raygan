services:
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_SECURITY_ADMIN_USER=${SERVICE_USER_GRAFANA}
      - GF_SECURITY_ADMIN_PASSWORD=${SERVICE_PASSWORD_GRAFANA}
      - GF_SERVER_ROOT_URL=${SERVICE_FQDN_GRAFANA_3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
    ports:
      - "3000"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki-data:/loki
      - type: bind
        source: ./loki/loki-config.yml
        target: /etc/loki/loki-config.yml
    ports:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - type: bind
        source: ./promtail/promtail-config.yml
        target: /etc/promtail/promtail-config.yml
    depends_on:
      - loki

volumes:
  grafana-data:
  loki-data:
